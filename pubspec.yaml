name: fx_calendar_app
description: "Kalender Ekonomi & Sinyal Forex/Kripto - 1:1 Myfxbook Clone Ramah Pemula"
publish_to: 'none'
version: 1.16.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  intl: ^0.19.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  google_fonts: ^6.1.0
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_logo.png"
  adaptive_icon_background: "#121212"
  adaptive_icon_foreground: "assets/icons/app_logo_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/logo/
